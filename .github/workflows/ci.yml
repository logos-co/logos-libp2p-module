name: CI Tests

on:
  push:
    branches: [ master ]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NIX_CONFIG: |
    experimental-features = nix-command flakes

jobs:
  flake-check:
    environment: ${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && 'public-cache' || '' }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (x86_64-linux)
            runner: ubuntu-latest
            system: x86_64-linux

          - name: Linux (aarch64-linux)
            runner: ubuntu-24.04-arm
            system: aarch64-linux

          - name: macOS (aarch64-darwin)
            runner: macos-latest
            system: aarch64-darwin
            macos_target: "11.3"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Logos nix cache: reads cache.nix.logos.co (public + ci) and publishes
      # what this job builds; logos-co.cachix.org stays as a read-only fallback.
      - name: Set up Nix and the Logos cache
        uses: logos-co/setup-nix-cache-action@v1
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}
          extra-nix-config: |
            extra-substituters = https://logos-co.cachix.org
            extra-trusted-public-keys = logos-co.cachix.org-1:12K8609ho1pCt0erUQrOrs/KmOuhWq/EhVwhzQRb35E=

      - name: Run flake checks
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_target }}
        run: |
          nix flake check \
            --system ${{ matrix.system }} \
            --print-build-logs \
            --show-trace

  e2e:
    environment: ${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && 'public-cache' || '' }}
    name: E2E (x86_64-linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Logos nix cache: reads cache.nix.logos.co (public + ci) and publishes
      # what this job builds; logos-co.cachix.org stays as a read-only fallback.
      - name: Set up Nix and the Logos cache
        uses: logos-co/setup-nix-cache-action@v1
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}
          extra-nix-config: |
            extra-substituters = https://logos-co.cachix.org
            extra-trusted-public-keys = logos-co.cachix.org-1:12K8609ho1pCt0erUQrOrs/KmOuhWq/EhVwhzQRb35E=

      # Pinned here, not as flake inputs: their input trees dominate flake.lock.
      - name: Build logoscore and lgpm
        run: |
          logoscore=$(nix build --no-link --print-out-paths \
            'github:logos-co/logos-logoscore-cli/4e8c7395f631a89c4fb849a27bfda2b4157ed3d2')
          lgpm=$(nix build --no-link --print-out-paths \
            'github:logos-co/logos-package-manager/d3af2972f51d9c542537d80d60ad8d20282ddcd1#cli')
          echo "LOGOSCORE_BIN=$logoscore/bin/logoscore" >> "$GITHUB_ENV"
          echo "LGPM_BIN=$lgpm/bin/lgpm" >> "$GITHUB_ENV"

      - name: Run openmetrics e2e
        run: nix run .#openmetrics-e2e

      - name: Run standalone e2e
        if: ${{ !cancelled() }}
        run: nix run .#standalone-e2e

  sanitizers:
    environment: ${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && 'public-cache' || '' }}
    name: Sanitizers (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        sanitizer: [asan, tsan]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Logos nix cache: reads cache.nix.logos.co (public + ci) and publishes
      # what this job builds; logos-co.cachix.org stays as a read-only fallback.
      - name: Set up Nix and the Logos cache
        uses: logos-co/setup-nix-cache-action@v1
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}
          extra-nix-config: |
            extra-substituters = https://logos-co.cachix.org
            extra-trusted-public-keys = logos-co.cachix.org-1:12K8609ho1pCt0erUQrOrs/KmOuhWq/EhVwhzQRb35E=

      - name: Build + run tests under ${{ matrix.sanitizer }}
        run: |
          nix build \
            ".#unit-tests-${{ matrix.sanitizer }}" \
            --system x86_64-linux \
            --print-build-logs \
            --show-trace

  windows-wsl:
    name: Windows (WSL x86_64-linux)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The VM gets 50% of the host RAM and 3 GB of swap by default. A parallel
      # nix build fills that, and the VM then thrashes until the job timeout.
      - name: Configure the WSL VM
        shell: powershell
        run: |
          @"
          [wsl2]
          processors=4
          memory=12GB
          swap=8GB
          swapFile=D:\\wsl-swap.vhdx
          "@ | Set-Content -Path "$env:USERPROFILE\.wslconfig" -Encoding ascii
          wsl --shutdown

      - name: Install Ubuntu (if missing)
        shell: powershell
        run: |
          $distros = wsl -l -q
          if (-not ($distros -match "Ubuntu")) {
            wsl --install -d Ubuntu --no-launch
          }

      - name: Run CI inside WSL
        shell: powershell
        run: >
          wsl -d Ubuntu bash -lc
          "set -e;
          sudo apt-get update;
          sudo apt-get install -y curl git;
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o /tmp/nix-install.sh https://install.determinate.systems/nix;
          sh /tmp/nix-install.sh install --no-confirm;
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh;
          nix flake check --system x86_64-linux --print-build-logs --show-trace
          --max-jobs 2 --cores 2 --max-silent-time 900
          --extra-substituters https://logos-co.cachix.org
          --extra-trusted-public-keys logos-co.cachix.org-1:12K8609ho1pCt0erUQrOrs/KmOuhWq/EhVwhzQRb35E="
